[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visiumhd-reusable-review"
version = "0.2.0"
description = "CSV-driven Visium HD workflow with resume adapters and isolated CPU/GPU workers"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "psutil", "fsspec"]

[tool.setuptools.packages.find]
include = ["vhd*"]
